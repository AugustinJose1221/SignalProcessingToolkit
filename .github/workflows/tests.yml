name: tests

on:
  push:
    branches:
      - main
      - development
      - 'feature/**'
      - 'fix/**'
      - 'refactor/**'
      - 'release/**'
      - 'test/**'
      - 'ci/**'
      - 'perf/**'
  pull_request:
    branches:
      - main
      - development

permissions:
  contents: read

jobs:
  documentation:
    name: Documentation check
    runs-on: ubuntu-latest
    steps:
      - name: Get the sources
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      - name: Test the documentation check
        run: python -m pytest scripts/test_api_doc.py -v

      - name: Examine that every function has a comment and that docs/API.md is current
        # docs/API.md comes from the comments in the headers. This step gives a
        # signal when a new function has no comment, or when somebody changed a
        # header and did not make the file again.
        run: python scripts/api_doc.py --check

  naming:
    name: Naming check
    runs-on: ubuntu-latest
    steps:
      - name: Get the sources
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      - name: Test the naming check
        # A check that cannot find a fault has no value. These tests give the
        # check a file with a known fault and examine that it finds the fault.
        run: python -m pytest scripts/test_check_naming.py -v

      - name: Check the names in the sources
        run: python scripts/check_naming.py

  unit-tests:
    # The library holds every number in real_t, which is 32 bits or 64. Both
    # widths must be examined, because a fault can live in one and not in the
    # other: a number too small to hold at 32 bits is held at 64, and a test
    # that ran at one width only would never see it.
    name: Unit tests (${{ matrix.width }} bit)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - width: 32
            define: SPTK_REAL_32
          - width: 64
            define: SPTK_REAL_64
    steps:
      - name: Get the sources
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ceedling and gcovr
        run: |
          gem install ceedling -v 1.0.1
          python -m pip install --upgrade pip gcovr

      - name: Run the unit tests
        run: ceedling test:all
        env:
          SPTK_DEFINE: ${{ matrix.define }}

      - name: Measure the coverage
        run: ceedling gcov:all
        env:
          SPTK_DEFINE: ${{ matrix.define }}

      - name: Keep the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report-${{ matrix.width }}
          path: build/artifacts/
          if-no-files-found: ignore

  property-tests:
    name: Property based tests (${{ matrix.width }} bit)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        width: [32, 64]
    steps:
      - name: Get the sources
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Hypothesis and pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tests/property/requirements.txt

      - name: Run the property based tests
        run: python -m pytest tests/property/ -v
        env:
          # The bindings build the library themselves, thus this one variable
          # chooses the width for the C build and for the Python that reads it.
          SPTK_REAL_64: ${{ matrix.width == 64 && '1' || '' }}

  build:
    name: Build (${{ matrix.width }} bit)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        width: [32, 64]
    steps:
      - name: Get the sources
        uses: actions/checkout@v4

      - name: Install CMake
        uses: lukka/get-cmake@latest

      - name: Build the library
        run: |
          cmake -S . -B build/library -DSPTK_REAL_64=${{ matrix.width == 64 && 'ON' || 'OFF' }}
          cmake --build build/library

      - name: Build the example program
        # The example files hold their code inside a condition on RUN_EXAMPLE.
        # Choose an example, or the program gets no main function.
        run: |
          sed -i 's/RUN_EXAMPLE     RUN_NONE/RUN_EXAMPLE     RUN_MATRIX_EXAMPLE/' examples/run_example.h
          cmake -S . -B build/example -DBUILD_EXAMPLE=ON -DSPTK_REAL_64=${{ matrix.width == 64 && 'ON' || 'OFF' }}
          cmake --build build/example
          ./build/example/signalproc_example

      - name: Build every example
        # Each example holds its own main function inside a condition on
        # RUN_EXAMPLE, thus one build gives one example. This step walks
        # through them, so that an example that stops working cannot pass
        # without a signal.
        run: |
          for example in FFT FILTER HHT EKF GOERTZEL DWT SAVGOL EMD MATRIX \
                         RESAMPLE PSD CORRELATE ADAPTIVE CLEAN FILTFILT \
                         KALMAN STREAM CALIBRATE LINALG ATTITUDE FITCURVE; do
            echo "== $example"
            sed -i "s/#define RUN_EXAMPLE     RUN_[A-Z_]*/#define RUN_EXAMPLE     RUN_${example}_EXAMPLE/" examples/run_example.h
            cmake -S . -B build/example -DBUILD_EXAMPLE=ON -DSPTK_REAL_64=${{ matrix.width == 64 && 'ON' || 'OFF' }} > /dev/null
            cmake --build build/example > /dev/null
            ./build/example/signalproc_example > /dev/null
          done
          git checkout examples/run_example.h

      - name: Build and run the benchmark
        # The benchmark needs no external library. The workflow runs it so that
        # a change that stops the benchmark cannot pass without a signal. It
        # does not compare the times, because the speed of a runner changes
        # from one run to the next.
        run: |
          cmake -S . -B build/benchmark -DBUILD_BENCHMARK=ON -DSPTK_REAL_64=${{ matrix.width == 64 && 'ON' || 'OFF' }}
          cmake --build build/benchmark
          ./build/benchmark/benchmark

      - name: Examine that the library needs no external library
        # The library must work with the C standard library alone. This step
        # reads the libraries that the shared object asks for. Only the C
        # library and the mathematics library may appear.
        run: |
          gcc -shared -fPIC -std=c99 -I. ${{ matrix.width == 64 && '-DSPTK_REAL_64' || '' }} -o /tmp/libsptk.so sptk/*/*.c -lm
          echo "The shared object asks for:"
          readelf -d /tmp/libsptk.so | grep NEEDED
          if readelf -d /tmp/libsptk.so | grep NEEDED | grep -qvE 'libc\.so|libm\.so'; then
            echo "The library asks for a library that it must not need."
            exit 1
          fi

  warnings:
    name: Compiler warnings (${{ matrix.width }} bit)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        width: [32, 64]
    steps:
      - name: Get the sources
        uses: actions/checkout@v4

      - name: Build each source with the warnings switched on
        # The sources give no warning. A new warning stops the job, thus a
        # warning cannot come into the repository without a signal.
        env:
          WIDTH: ${{ matrix.width == 64 && '-DSPTK_REAL_64' || '' }}
        run: |
          status=0
          for source in sptk/*/*.c perf/benchmark/*.c; do
            echo "== $source"
            gcc -std=c99 -Wall -Wextra -Werror $WIDTH -c -I. -o /dev/null "$source" || status=1
          done
          # Each example holds its code inside a condition on RUN_EXAMPLE, thus
          # the build must switch each one on to see its code at all.
          for example in FFT FILTER HHT EKF GOERTZEL DWT SAVGOL EMD MATRIX \
                         RESAMPLE PSD CORRELATE ADAPTIVE CLEAN FILTFILT \
                         KALMAN STREAM CALIBRATE LINALG ATTITUDE FITCURVE; do
            sed -i "s/#define RUN_EXAMPLE     RUN_[A-Z_]*/#define RUN_EXAMPLE     RUN_${example}_EXAMPLE/" examples/run_example.h
            for source in examples/*.c; do
              gcc -std=c99 -Wall -Wextra -Werror $WIDTH -c -I. -o /dev/null "$source" || status=1
            done
          done
          git checkout examples/run_example.h
          exit $status
