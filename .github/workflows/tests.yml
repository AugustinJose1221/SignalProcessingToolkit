name: tests

on:
  push:
    branches:
      - main
      - development
      - 'feature/**'
      - 'fix/**'
      - 'refactor/**'
      - 'release/**'
      - 'test/**'
      - 'ci/**'
      - 'perf/**'
  pull_request:
    branches:
      - main
      - development

permissions:
  contents: read

jobs:
  documentation:
    name: Documentation check
    runs-on: ubuntu-latest
    steps:
      - name: Get the sources
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      - name: Test the documentation check
        run: python -m pytest scripts/test_api_doc.py -v

      - name: Examine that every function has a comment and that docs/API.md is current
        # docs/API.md comes from the comments in the headers. This step gives a
        # signal when a new function has no comment, or when somebody changed a
        # header and did not make the file again.
        run: python scripts/api_doc.py --check

  naming:
    name: Naming check
    runs-on: ubuntu-latest
    steps:
      - name: Get the sources
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      - name: Test the naming check
        # A check that cannot find a fault has no value. These tests give the
        # check a file with a known fault and examine that it finds the fault.
        run: python -m pytest scripts/test_check_naming.py -v

      - name: Check the names in the sources
        run: python scripts/check_naming.py

  examples-wired:
    name: Example check
    runs-on: ubuntu-latest
    steps:
      - name: Get the sources
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check that every example is wired in
        # An example whose name is missing from run_example.h counts as zero
        # inside its condition, and zero is RUN_NONE. It then gives a main
        # function in the default build, which is the one build that must give
        # none. That fault came into this repository twice and passed every
        # other check both times, because each example is built by name and the
        # one whose name is missing is the one that compiles.
        run: python scripts/check_examples.py

  freeze:
    name: Freeze check
    runs-on: ubuntu-latest
    steps:
      - name: Get the sources
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check that the public surface has not grown
        # The library is in a feature freeze from 0.17.0: it takes fixes, tests
        # and documentation, and not new public functions. A freeze that is only
        # written down is one that ends the first time somebody is in a hurry,
        # thus the counts are recorded and this compares against them.
        run: python scripts/check_freeze.py

  unit-tests:
    # The library holds every number in real_t, which is 32 bits or 64. Both
    # widths must be examined, because a fault can live in one and not in the
    # other: a number too small to hold at 32 bits is held at 64, and a test
    # that ran at one width only would never see it.
    name: Unit tests (${{ matrix.width }} bit)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - width: 32
            define: FFITT_REAL_32
          - width: 64
            define: FFITT_REAL_64
    steps:
      - name: Get the sources
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ceedling and gcovr
        run: |
          gem install ceedling -v 1.0.1
          python -m pip install --upgrade pip gcovr

      - name: Run the unit tests
        run: ceedling test:all
        env:
          FFITT_DEFINE: ${{ matrix.define }}

      - name: Measure the coverage
        run: ceedling gcov:all
        env:
          FFITT_DEFINE: ${{ matrix.define }}

      - name: Examine that enough of the library was run
        # TWO OF THE THINGS THE FREEZE ASKS FOR, CHECKED RATHER THAN HOPED FOR.
        #
        # Every public function must be run by something. That one is held at
        # 100 and it has been met since 0.17.0, when three functions were found
        # that nothing had ever called.
        #
        # Lines are held at 98 and not 99. What is left is the guards against
        # the heap giving nothing and against numbers the width cannot hold.
        # Reaching those needs an allocator that fails on purpose, or calls
        # that break what the headers say a caller may do. Covering every line
        # a caller CAN reach still leaves the whole below 99, thus 99 is a
        # number the code cannot meet while those guards stand, and taking the
        # guards out to meet it would be the wrong trade.
        #
        # BRANCHES ARE HELD AT 90, AND THE ASSERTIONS ARE LEFT OUT OF THE COUNT.
        #
        # An ASSERT states what the CALLER must have got right, and its failing
        # side calls abort. A suite that passes has by construction never taken
        # that side, thus counting those branches as uncovered measures nothing
        # at all. There are 964 of them, and left in they hold the whole at 74
        # percent and hide every real gap behind a wall of permanently red
        # branches that no test could ever turn green.
        #
        # Left out, the number is 91.2 and it means something. What is still
        # uncovered is mostly the operand combinations of the conditions in the
        # validators: a refusal is tested, and which of the two halves of an
        # `&&` caused it is not. The gate stands at 90, which is the same
        # margin the line gate keeps against its own 98.3.
        #
        # gcovr is called straight rather than through the plugin, because the
        # plugin fails by raising an exception and not by saying which number
        # was missed.
        run: |
          gcovr -r . --filter 'ffitt/' --print-summary \
            --exclude-lines-by-pattern '\s*ASSERT\(.*' \
            --fail-under-line 98 --fail-under-function 100 \
            --fail-under-branch 90

      - name: Keep the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report-${{ matrix.width }}
          path: build/artifacts/
          if-no-files-found: ignore

  property-tests:
    name: Property based tests (${{ matrix.width }} bit)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        width: [32, 64]
    steps:
      - name: Get the sources
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Hypothesis and pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tests/property/requirements.txt

      - name: Run the property based tests
        run: python -m pytest tests/property/ -v
        env:
          # The bindings build the library themselves, thus this one variable
          # chooses the width for the C build and for the Python that reads it.
          FFITT_REAL_64: ${{ matrix.width == 64 && '1' || '' }}

  build:
    name: Build (${{ matrix.width }} bit)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        width: [32, 64]
    steps:
      - name: Get the sources
        uses: actions/checkout@v4

      - name: Install CMake
        uses: lukka/get-cmake@latest

      - name: Build the library
        run: |
          cmake -S . -B build/library \
            -DFFITT_REAL_64=${{ matrix.width == 64 && 'ON' || 'OFF' }} \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake --build build/library

      - name: Examine that the width asked for reached the compiler
        # THE FLAG WAS PASSED AND NOTHING READ IT. Every build in this job
        # asked for 64 bits and every one was built at 32, because
        # CMakeLists.txt never looked at the variable. Nothing failed, because
        # a build that quietly gives the wrong thing still gives a thing.
        #
        # This step reads the commands that cmake really ran and looks for the
        # definition among them. A flag that is asked for and not read now
        # stops the build, and so does one that arrives when it was not asked
        # for.
        run: |
          if grep -q -- '-DFFITT_REAL_64' build/library/compile_commands.json; then
            reached=yes
          else
            reached=no
          fi
          wanted=${{ matrix.width == 64 && 'yes' || 'no' }}
          echo "asked for ${{ matrix.width }} bits; the definition reached the compiler: $reached"
          if [ "$reached" != "$wanted" ]; then
            echo "The width asked for is not the width that was built."
            exit 1
          fi

      - name: Build the example program
        # The example files hold their code inside a condition on RUN_EXAMPLE.
        # Choose an example, or the program gets no main function.
        run: |
          sed -i 's/RUN_EXAMPLE     RUN_NONE/RUN_EXAMPLE     RUN_MATRIX_EXAMPLE/' examples/run_example.h
          cmake -S . -B build/example -DBUILD_EXAMPLE=ON -DFFITT_REAL_64=${{ matrix.width == 64 && 'ON' || 'OFF' }}
          cmake --build build/example
          ./build/example/ffitt_example

      - name: Build every example
        # Each example holds its own main function inside a condition on
        # RUN_EXAMPLE, thus one build gives one example. This step walks
        # through them, so that an example that stops working cannot pass
        # without a signal.
        run: |
          for example in FFT FILTER HHT EKF GOERTZEL DWT SAVGOL EMD MATRIX \
                         RESAMPLE PSD CORRELATE ADAPTIVE CLEAN FILTFILT \
                         KALMAN STREAM CALIBRATE LINALG ATTITUDE FITCURVE \
                         SPECTROGRAM COHERENCE SHAPES CONTINUOUS \
                         SURVEY DETECT; do
            echo "== $example"
            sed -i "s/#define RUN_EXAMPLE     RUN_[A-Z_]*/#define RUN_EXAMPLE     RUN_${example}_EXAMPLE/" examples/run_example.h
            cmake -S . -B build/example -DBUILD_EXAMPLE=ON -DFFITT_REAL_64=${{ matrix.width == 64 && 'ON' || 'OFF' }} > /dev/null
            cmake --build build/example > /dev/null
            ./build/example/ffitt_example > /dev/null
          done
          git checkout examples/run_example.h

      - name: Install the GNU Scientific Library
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libgsl-dev

      - name: Build and run the conformation tests
        # THESE WERE NEVER RUN. The tests compare this library against the GNU
        # Scientific Library, which is the only place anything here is held
        # against an outside authority. They were off by default, no job built
        # them, and no job read them, thus 940 lines of test sat unread. When
        # they were built again 3 of the 75 were failing, and the binary told
        # the shell that all was well.
        run: |
          cmake -S . -B build/conformation -DBUILD_CONFORMATION_TESTS=ON \
            -DFFITT_REAL_64=${{ matrix.width == 64 && 'ON' || 'OFF' }}
          cmake --build build/conformation
          ./build/conformation/conformation

      - name: Build and run the cost tests
        # THE HEADERS SAY WHAT THINGS COST AND NOTHING HELD THEM TO IT. movavg
        # says its work does not follow the window, resample says the filtering
        # costs the output rate and not the input rate, and correlate says the
        # transform wins above about 300 samples. Those sentences decide which
        # function a caller picks. The benchmark measures and prints, thus a
        # claim could stop being true and the table would still be green.
        #
        # AT 32 BITS ONLY, AND ON PURPOSE. Two of the twelve claims break at 64
        # bits, and the cause is not the library: GCC 13.3 builds the same
        # transform more than six times slower at 64 bits with -O2 than with
        # -O1, and the answers do not change. perf/cost/README.md holds the
        # measurement. A job that is known to be red teaches nobody anything,
        # thus 64 bits waits until the transform is dealt with.
        if: matrix.width == 32
        run: |
          cmake -S . -B build/cost -DBUILD_COST_TESTS=ON
          cmake --build build/cost
          ./build/cost/cost

      - name: Build and run the benchmark
        # The benchmark needs no external library. The workflow runs it so that
        # a change that stops the benchmark cannot pass without a signal. It
        # does not compare the times, because the speed of a runner changes
        # from one run to the next.
        #
        # IT USED TO MEASURE NOTHING AND STILL PASS HERE. The clock was read
        # into a real_t, which holds about 7 digits against the 10 that seconds
        # since 1970 already need, thus every reading rounded to the same
        # number and every line of the table said 0.000 microseconds. This step
        # went green on it, because a program that measures nothing still
        # finishes and still gives 0 to the shell. The benchmark now counts how
        # many of its measurements came out above nothing and gives 1 when none
        # did, thus this step fails if the same fault comes back. That guard was
        # held against a build with the narrow clock put back, which gave 1.
        run: |
          cmake -S . -B build/benchmark -DBUILD_BENCHMARK=ON -DFFITT_REAL_64=${{ matrix.width == 64 && 'ON' || 'OFF' }}
          cmake --build build/benchmark
          ./build/benchmark/benchmark

      - name: Examine that the table of costs names every operation
        # README.md holds a table of what each operation costs, written from
        # this benchmark by scripts/benchmark_table.py. This asks that the
        # table still names every operation the benchmark measures, so that an
        # operation added here and forgotten there is caught.
        #
        # IT LOOKS AT THE ROWS AND NEVER AT THE TIMES. A time belongs to the
        # machine that measured it, and this runner is not that machine.
        if: matrix.width == 32
        run: python3 scripts/benchmark_table.py --check

      - name: Examine that the library needs no external library
        # The library must work with the C standard library alone. This step
        # reads the libraries that the shared object asks for. Only the C
        # library and the mathematics library may appear.
        run: |
          gcc -shared -fPIC -std=c99 -I. ${{ matrix.width == 64 && '-DFFITT_REAL_64' || '' }} -o /tmp/libffitt.so ffitt/*/*.c -lm
          echo "The shared object asks for:"
          readelf -d /tmp/libffitt.so | grep NEEDED
          if readelf -d /tmp/libffitt.so | grep NEEDED | grep -qvE 'libc\.so|libm\.so'; then
            echo "The library asks for a library that it must not need."
            exit 1
          fi

  warnings:
    name: Compiler warnings (${{ matrix.width }} bit)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        width: [32, 64]
    steps:
      - name: Get the sources
        uses: actions/checkout@v4

      - name: Install the GNU Scientific Library
        # The conformation sources are read here as well, and they include the
        # headers of that library.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libgsl-dev

      - name: Build each source with the warnings switched on
        # The sources give no warning. A new warning stops the job, thus a
        # warning cannot come into the repository without a signal.
        env:
          WIDTH: ${{ matrix.width == 64 && '-DFFITT_REAL_64' || '' }}
        run: |
          status=0
          for source in ffitt/*/*.c perf/benchmark/*.c perf/cost/*.c perf/conformation/*.c perf/conformation/*/*.c; do
            echo "== $source"
            gcc -std=c99 -O2 -Wall -Wextra -Werror -Wmissing-prototypes -Wstrict-prototypes $WIDTH -c -I. -o /dev/null "$source" || status=1
          done
          # Each example holds its code inside a condition on RUN_EXAMPLE, thus
          # the build must switch each one on to see its code at all.
          for example in FFT FILTER HHT EKF GOERTZEL DWT SAVGOL EMD MATRIX \
                         RESAMPLE PSD CORRELATE ADAPTIVE CLEAN FILTFILT \
                         KALMAN STREAM CALIBRATE LINALG ATTITUDE FITCURVE \
                         SPECTROGRAM COHERENCE SHAPES CONTINUOUS \
                         SURVEY DETECT; do
            sed -i "s/#define RUN_EXAMPLE     RUN_[A-Z_]*/#define RUN_EXAMPLE     RUN_${example}_EXAMPLE/" examples/run_example.h
            for source in examples/*.c; do
              gcc -std=c99 -O2 -Wall -Wextra -Werror -Wmissing-prototypes -Wstrict-prototypes $WIDTH -c -I. -o /dev/null "$source" || status=1
            done
          done
          git checkout examples/run_example.h
          exit $status
